<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kamera – TRV Webbkameror</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">← Alla kameror</a>
    <div id="status" class="status"></div>
    <nav><a href="admin.html">⚙ Admin</a></nav>
  </header>

  <main class="camera-page">
    <div class="cam-head">
      <div>
        <h1 id="camName">Laddar…</h1>
        <p class="muted" id="camMeta"></p>
      </div>
      <label class="switch big">
        <input type="checkbox" id="enabled">
        <span class="slider"></span>
        <span class="switch-label" id="enabledLabel">Aktiv</span>
      </label>
    </div>

    <div class="cam-grid">
      <figure class="card viewer">
        <div class="viewer-frame">
          <img id="latest" alt="Senaste bild">
          <button type="button" class="nav prev" id="prevImg" aria-label="Föregående bild" title="Föregående bild (←)" hidden>&#8249;</button>
          <button type="button" class="nav next" id="nextImg" aria-label="Nästa bild" title="Nästa bild (→)" hidden>&#8250;</button>
        </div>
        <figcaption class="viewer-caption">
          <span class="muted" id="latestCaption"></span>
          <button type="button" class="btn small ghost" id="toLatest" hidden>Till senaste</button>
          <span class="viewer-actions" id="shotActions" hidden>
            <button type="button" class="btn small ghost" id="delShot">Ta bort bilden</button>
            <button type="button" class="btn small ghost" id="delDay">Ta bort dagen</button>
          </span>
        </figcaption>
      </figure>
      <div class="card">
        <h2>Inställningar för kameran</h2>
        <div class="cam-settings">
          <label class="field">
            <span>Temperaturgraf (vägtemperatur)</span>
            <select id="tempMode" aria-describedby="stationInfo"></select>
          </label>
          <p class="muted" id="stationInfo"></p>
          <label class="field">
            <span>Bildupplösning</span>
            <select id="resMode" aria-describedby="resInfo"></select>
          </label>
          <p class="muted" id="resInfo"></p>
        </div>
        <div id="miniMap" class="mini-map"></div>
      </div>
    </div>

    <section class="card gen-card">
      <h2>Generera timelapse</h2>
      <p class="muted">Välj ett förval eller ett tidsspann i kalendern, format och längd, och tryck på
        <b>Generera</b>. Klippet hamnar i biblioteket nedan.</p>
      <div id="generator"></div>
      <div id="jobStatus" class="job-status"></div>
    </section>

    <h2>Klipp</h2>
    <div id="clips" class="clip-list"></div>

    <section class="card cam-admin" id="camAdmin" hidden>
      <h2>Radera för kameran</h2>
      <div class="cam-delete">
        <label class="field"><span>Bilder äldre än</span><input type="date" id="delBefore"></label>
        <button type="button" class="btn small danger" id="delOlder">Ta bort äldre bilder</button>
        <button type="button" class="btn small danger" id="delAllImages">Ta bort alla bilder</button>
        <button type="button" class="btn small danger" id="delAllClips">Ta bort alla timelapses</button>
      </div>
      <p class="muted" id="camAdminResult" role="status"></p>
    </section>
    <p class="muted admin-hint" id="adminHint" hidden>
      <a href="admin.html">Logga in som admin</a> för att ta bort bilder och timelapses.</p>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="common.js"></script>
  <script src="generate.js"></script>
  <script src="camera.js"></script>
</body>
</html>
